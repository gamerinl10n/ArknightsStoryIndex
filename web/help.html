{% extends 'base.html' %}
{% block content %}<article class="document" lang="{{ ui }}"><a href="/?ui={{ ui }}" class="back-link">← {{ t('back') }}</a>
<h1>{{ page.title }}</h1>{% for section in page.sections %}<section><h2>{{ section.title }}</h2>{% for paragraph in section.paragraphs %}<p>{{ paragraph }}</p>{% endfor %}</section>{% endfor %}</article>{% endblock %}
