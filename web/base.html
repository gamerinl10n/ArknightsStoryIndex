<!doctype html><html lang="{{ ui }}"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} · Arknights Story Index</title>
<meta name="description" content="{{ t('subtitle') }}"><meta name="deployment-version" content="{{ deployment_version }}">
<meta name="theme-color" content="#f0f0f0" id="themeColorMeta"><meta name="color-scheme" content="light dark" id="colorSchemeMeta">
<script src="/theme.js"></script><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme-control.css"><link rel="stylesheet" href="/update-banner.css">
<script src="/i18n.js?ui={{ ui }}" defer></script><script src="/chrome.js" defer></script><script type="module" src="/update-banner.mjs"></script>
</head><body>
<header><a href="/?ui={{ ui }}" class="brand"><span class="brand-mark">ASI</span><span>Arknights Story Index<small>{{ t('subtitle') }}</small></span></a><nav class="header-actions" aria-label="{{ t('ui_language') }}"><select id="ui-language" aria-label="{{ t('ui_language') }}">{% for code,label in ui_languages.items() %}<option value="{{ code }}" {% if code==ui %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><a href="/help?ui={{ ui }}" class="btn btn-secondary btn-icon workspace-help-button" title="{{ t('help') }}" aria-label="{{ t('help') }}"><svg class="help-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M9.1 8.7a3.15 3.15 0 1 1 4.55 2.82C12.58 12.12 12 12.82 12 14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="18" r="1.15" fill="currentColor"/></svg></a>{% include '_theme-button.html' %}</nav></header>
<main>{% block content %}{% endblock %}</main>
<footer class="site-footer"><nav class="footer-links" aria-label="{{ t('help') }}">{% for page in ['privacy','terms','license','changelog'] %}<a href="/{{ page }}?ui={{ ui }}">{{ t(page) }}</a>{% endfor %}<a href="https://tally.so/r/lb2Lxo" target="_blank" rel="noopener noreferrer">{{ t('feedback') }} ↗</a><a href="https://github.com/gamerinl10n/ArknightsStoryIndex">GitHub ↗</a></nav><p>© 2026 gamerinl10n</p></footer>
{% block scripts %}{% endblock %}</body></html>
