<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arknights Story Index</title><link rel="stylesheet" href="/style.css"><body><header><span>ASI / STORY RESEARCH</span><button id="admin">관리자 인증</button></header><main><p class="eyebrow">ARKNIGHTS STORY INDEX</p><h1>말을 찾고,<br>관계를 읽다.</h1><p class="intro">한 인물의 말투부터 두 인물 사이의 호칭까지. 대사와 문맥으로 확인하세요.</p><form id="search"><div class="people"><label>말하는 인물 A<input id="speaker" list="characters" placeholder="화자 이름" required></label><button type="button" id="swap" aria-label="화자와 대상 바꾸기">⇄</button><label>대상 인물 B · 선택<input id="target" list="characters" placeholder="비워두면 A의 전체 대사"></label></div><datalist id="characters"></datalist><div class="filters"><input id="query" aria-label="대사 키워드" placeholder="대사 속 표현 검색"><select id="lang" aria-label="언어"><option value="ko_KR">한국어</option><option value="zh_CN">중국어</option></select><label><input type="checkbox" id="spoilers"> 중국 서버 선행분 포함</label><button>검색</button></div></form><p id="notice" role="status">인물을 선택해 검색하세요. 자동 후보는 호칭이 확정된 용례가 아닙니다.</p><section id="results"></section><button id="more" hidden>더 보기</button><footer>비공식 팬 프로젝트 · 원문 권리는 각 권리자에게 있습니다.<br>언어 대조는 같은 파일·줄 위치의 후보이며, 정확한 대응은 문맥으로 확인하세요.</footer></main><script src="/app.js" defer></script></body></html>
